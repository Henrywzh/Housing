<style>
:root{
  --plate:#e3e9ee; --paper:#f2f4f6; --panel:#ffffff; --panel-2:#f7f9fa;
  --ink:#121b24; --ink-2:#3d4c58; --muted:#6a7884; --rule:#d9e0e6;
  --signal:#c2402a; --signal-soft:#f0d5cf;
  --good:#2c6f52; --warn:#9a6b12; --bad:#a8382a;
  --shadow:0 1px 2px rgba(18,27,36,.07),0 8px 24px rgba(18,27,36,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e141a; --panel:#161e26; --panel-2:#1b242d;
  --ink:#e7edf2; --ink-2:#b3c0cb; --muted:#8798a5; --rule:#2a353f;
  --signal:#e8664c; --signal-soft:#48231c;
  --good:#5fb389; --warn:#d9a640; --bad:#e07a68;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e141a; --panel:#161e26; --panel-2:#1b242d;
  --ink:#e7edf2; --ink-2:#b3c0cb; --muted:#8798a5; --rule:#2a353f;
  --signal:#e8664c; --signal-soft:#48231c;
  --good:#5fb389; --warn:#d9a640; --bad:#e07a68;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 14px/1.5 "Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,.ui{font-family:Archivo,"Source Sans 3",sans-serif;text-wrap:balance}

#app{display:grid;grid-template-columns:300px minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);height:100%;overflow:hidden}
#app.with-detail{grid-template-columns:300px minmax(0,1fr) 320px}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--rule)}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:12.5px;flex:1 1 200px;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabs{display:flex;gap:2px;padding:2px;background:var(--panel-2);border:1px solid var(--rule);
  border-radius:8px;align-self:center}
#tabs button{border:0;background:none;color:var(--muted);font:500 12.5px/1 Archivo,sans-serif;
  padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
#tabs button:hover{color:var(--ink)}
#tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
#tabs button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
/* The price-trend page is its own document with its own data, so it lives in a
   frame rather than being transplanted: neither page has to know the other's
   CSS or globals, and its 3.9 MB loads only when the tab is first opened. */
#trend{grid-column:1/-1;grid-row:2;min-height:0;display:none}
#trend iframe{width:100%;height:100%;border:0;display:block;background:var(--paper)}
#app.trend{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
#app.trend > #rail, #app.trend > #mapwrap, #app.trend > #detail{display:none!important}
#app.trend > #trend{display:block}
#app.trend #stamp{display:none}
header .stamp{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

#rail{background:var(--panel);border-right:1px solid var(--rule);overflow:hidden;
  display:flex;flex-direction:column;min-height:0}
#controls{overflow-y:auto;flex:0 0 auto;max-height:58%}
#mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:var(--plate)}

.block{padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;
  flex-direction:column;gap:7px}
.block.two{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.block.two .lbl{grid-column:1/-1}
.lbl{font-family:Archivo,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{font:600 12px/1 Archivo,sans-serif;padding:6px 9px;border-radius:5px;
  border:1px solid var(--rule);background:var(--panel-2);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.seg button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
select{font:inherit;font-size:12.5px;width:100%;background:var(--panel-2);color:var(--ink);
  border:1px solid var(--rule);border-radius:6px;padding:6px 8px}
select:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row .v{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.row .w{flex:0 0 34px;font-family:Archivo,sans-serif;font-size:12px;color:var(--ink-2)}
input[type=range]{width:100%;accent-color:var(--signal)}
label.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer}
label.chk input{accent-color:var(--signal)}
#railOps{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
#railOps label{display:flex;align-items:center;gap:6px;font-size:11.5px;
  color:var(--ink-2);cursor:pointer;min-width:0}
#railOps input{accent-color:var(--signal);flex:0 0 auto;margin:0}
#railOps s{flex:0 0 15px;height:0;border-top:3px dashed currentColor;text-decoration:none}
#railOps span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.lnk{border:0;background:none;color:var(--muted);font:600 11px Archivo,sans-serif;cursor:pointer;
  text-decoration:underline;padding:0}
.lnk:hover{color:var(--ink)}
#presets button{background:var(--signal-soft);border-color:var(--signal);color:var(--ink)}
#filterBlock .seg button{padding:5px 8px;font-size:11.5px}
.dual{position:relative;height:20px;margin:2px 0 4px}
.dual .rail{position:absolute;left:7px;right:7px;top:8px;height:4px;border-radius:2px;background:var(--rule)}
.dual .rail i{position:absolute;top:0;bottom:0;background:var(--signal);border-radius:2px}
.dual input{position:absolute;left:0;top:0;width:100%;height:20px;margin:0;background:none;
  pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-runnable-track{background:none;height:20px}
.dual input::-moz-range-track{background:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:15px;height:15px;
  border-radius:50%;background:var(--panel);border:2px solid var(--signal);margin-top:2px;cursor:pointer}
.dual input::-moz-range-thumb{pointer-events:auto;width:11px;height:11px;border-radius:50%;
  background:var(--panel);border:2px solid var(--signal);cursor:pointer}
.item .dv{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
#railBlock.off,#homeBlock.off{opacity:.4;pointer-events:none}
#homeSrc{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
#homeSrc label{display:flex;align-items:center;gap:6px;font-size:11.5px;cursor:pointer;min-width:0}
#homeSrc input{accent-color:var(--signal);flex:0 0 auto;margin:0}
#homeSrc img{flex:0 0 18px;width:18px;height:18px}
#homeSrc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
#homeSrc em{font-style:normal;color:var(--muted);font-size:10.5px;margin-left:auto;padding-left:4px}
#homeBlock .seg button{padding:3px 7px;font-size:11px}
#railBlock .seg button{padding:3px 7px;font-size:11px}
#railStnRow{font-size:12px;margin-top:2px}

#listwrap{flex:1 1 auto;min-height:160px;overflow-y:auto}
#count{padding:9px 14px 4px;font-size:11.5px;color:var(--muted)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 14px;
  border:0;border-bottom:1px solid var(--rule);cursor:pointer;background:none;
  width:100%;text-align:left;font:inherit;color:inherit}
.item:hover{background:var(--panel-2)}
.item[aria-current="true"]{background:var(--signal-soft)}
.item .nm{font-family:Archivo,sans-serif;font-weight:600;font-size:13.5px}
.item .sc{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;
  font-variant-numeric:tabular-nums}
.item .meta{grid-column:1/-1;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;display:flex;gap:9px;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10.5px;
  font-family:Archivo,sans-serif;font-weight:600;letter-spacing:.03em}
.pill.z{background:var(--panel-2);color:var(--muted);border:1px solid var(--rule)}
.pill.w{background:var(--good);color:#fff}
.pill.bad{background:#fbe9e5;color:#a1321f;border:1px solid #e8b5aa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.bad{background:#3a1f1a;color:#f2a99a;border-color:#6b3329}}

#legend{position:absolute;left:12px;bottom:12px;z-index:5;background:var(--panel);
  border:1px solid var(--rule);border-radius:7px;padding:9px 11px;box-shadow:var(--shadow);
  max-width:236px}
.ramp{display:flex;height:9px;border-radius:2px;overflow:hidden}
.ramp i{flex:1}
.ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);
  margin-top:4px;font-family:"IBM Plex Mono",monospace}
#legend .note{font-size:10.5px;color:var(--muted);margin-top:7px;line-height:1.4}
#legend .lbl{margin-bottom:6px}

#detail{grid-row:2;grid-column:3;background:var(--panel);border-left:1px solid var(--rule);
  overflow-y:auto;padding:14px 15px 24px;min-width:0;position:relative}
#detail h2{margin:0 0 2px;font-size:19px;font-weight:700;letter-spacing:-.01em}
#detail .where{color:var(--muted);font-size:12px;margin-bottom:11px}
#detail .close{position:absolute;right:9px;top:9px;border:0;background:none;cursor:pointer;
  color:var(--muted);font-size:19px;line-height:1;padding:3px 6px;border-radius:4px}
#detail .close:hover{background:var(--panel-2);color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:0;font-family:"IBM Plex Mono",monospace;font-size:12.5px;text-align:right;
  font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}
.bar{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;font-size:11.5px}
.bar .t{color:var(--muted)}
.bar .track{display:block;height:7px;background:var(--panel-2);border:1px solid var(--rule);
  border-radius:4px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar .p{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-2);min-width:30px;
  text-align:right}
.sect{font-family:Archivo,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin:14px 0 7px;padding-top:11px;
  border-top:1px solid var(--rule)}
.lines{display:flex;flex-wrap:wrap;gap:4px}
.line{font-size:10.5px;font-family:Archivo,sans-serif;font-weight:600;padding:2px 6px;
  border-radius:3px;color:#fff;white-space:nowrap}
.caveat{font-size:11.5px;color:var(--muted);line-height:1.45;margin:9px 0 0}
.lcard{border:1px solid var(--rule);border-radius:7px;padding:9px 10px;margin-bottom:8px;
  background:var(--panel-2)}
.lcard .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lcard .p{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;
  font-variant-numeric:tabular-nums}
.lcard .b{font-family:Archivo,sans-serif;font-size:11px;font-weight:600;color:var(--muted)}
.lcard .g{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;margin-top:6px;
  font-size:11px}
.lcard .g b{display:block;font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.lcard .g span{color:var(--muted)}
.lcard a{display:inline-block;margin-top:7px;font-size:11.5px;color:var(--signal);
  text-decoration:none;font-weight:600}
.lcard a:hover{text-decoration:underline}
.ptab{width:100%;border-collapse:collapse;font-size:12px;margin:2px 0 6px}
.ptab td{padding:4px 2px;border-bottom:1px solid var(--rule);white-space:nowrap}
.ptab td.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.ptab td.m{color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:120px}
.ptab tr.lo td.n{color:var(--good);font-weight:600}
.chip{display:inline-block;font:600 10.5px/1 Archivo,sans-serif;letter-spacing:.04em;padding:3px 6px;
  border-radius:4px;background:#14325c;color:#fff;vertical-align:2px;margin-left:6px}
.chip.soon{background:none;color:#14325c;border:1px solid #14325c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.soon{color:#8fb3e0;border-color:#8fb3e0}}
.lcard .src{font-size:10.5px;color:var(--muted);margin-top:4px}
.na{color:var(--muted)}

#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--plate);
  z-index:9;font-family:Archivo,sans-serif;color:#3d4c58;font-size:13px;text-align:center;
  padding:0 24px;line-height:1.6}
.maplibregl-ctrl-attrib{font:11px/1.4 "Source Sans 3",sans-serif}

@media (max-width:1100px){
  #app.with-detail{grid-template-columns:300px minmax(0,1fr)}
  #detail{position:absolute;grid-row:auto;grid-column:auto;left:12px;right:12px;bottom:12px;
    top:auto;max-height:46%;z-index:6;border:1px solid var(--rule);border-radius:9px;
    box-shadow:var(--shadow);padding:13px 14px 16px}
  #legend{display:none}
}
@media (max-width:760px){
  #app,#app.with-detail{grid-template-columns:1fr;grid-template-rows:auto 56vh minmax(0,1fr)}
  #rail{grid-row:3;border-right:0;border-top:1px solid var(--rule)}
  #controls{max-height:none;flex:0 0 auto}
  #mapwrap{grid-row:2}
  #app.trend{grid-template-rows:auto minmax(0,1fr)}
  header h1{font-size:15px}
  header .sub{display:none}
}

<script>
const RAMP = ['#dbe4ec','#b8cbdb','#8fadc6','#6690b1','#3f7099','#20527d','#0d3459'];
const NODATA = '#c9ced2';
const LINE_COLOR = {
  'Bakerloo':'#B36305','Central':'#E32017','Circle':'#FFD300','District':'#00782A',
  'Hammersmith & City':'#F3A9BB','Jubilee':'#A0A5A9','Metropolitan':'#9B0056',
  'Northern':'#000000','Piccadilly':'#003688','Victoria':'#0098D4',
  'Waterloo & City':'#95CDBA','DLR':'#00A4A7','Elizabeth line':'#6950a1',
  'Tram':'#84B817','London Overground':'#EE7C0E','Liberty':'#5D6061','Lioness':'#FFB600',
  'Mildmay':'#437EC0','Suffragette':'#76B82A','Weaver':'#823A62','Windrush':'#ED1B00'
};
// The same operator colours the map draws, so a chip on a station panel and a
// dashed line on the map are recognisably the same company. Sub-brands take the
// colour of the metals they run on, as they do on the map; everything that is
// not a way to commute into London is the long-distance grey.
Object.assign(LINE_COLOR, {
  'Thameslink':'#EE4B95', 'Southeastern':'#0071B9', 'Southern':'#78BE20',
  'Gatwick Express':'#78BE20', 'Great Northern':'#6B2C91',
  'South Western Railway':'#1B3D6D', 'Greater Anglia':'#B01020',
  'Stansted Express':'#B01020', 'c2c':'#D41B8C', 'Chiltern Railways':'#00857D',
  'Great Western Railway':'#0A493E'});
for (const op of ['East Midlands Railway','West Midlands Trains','Heathrow Express',
  'Hull Trains','Grand Central','Lumo','Avanti West Coast','CrossCountry',
  'London North Eastern Railway','Eurostar','Caledonian Sleeper'])
  LINE_COLOR[op] = '#8A939B';
const $ = s => document.querySelector(s);
const fmtK = v => v == null ? '—' : '£' + Math.round(v/1000) + 'k';
const pct = v => Math.round(v*100);

let MAP, S = [], AM = {}, SHORT = null, BREAKS = {}, SEL = null, metric = 'br', ready = false;
let GP_RANK = () => null, LGROUPS = [], SC = [], mode = 'station', RAIL_ON = null, DEV = null, SRC_ON = null;

/* ---------- National Rail operators ---------- */
// A track carrying four companies is four features, one per company, so a
// corridor shows whoever is on top when everything is on -- and exactly one
// network when the reader picks one. That is what the filter is for: "where do
// Southeastern's trains actually go" is a question the merged layer cannot
// answer, and it is the question behind choosing a flat in south London.
// A station lists the brands that call there, and they are not always the names
// in the legend: Gatwick Express runs on Southern's metals and Stansted Express
// on Greater Anglia's, and anything that is not a way to commute into London is
// the one grey group. Folded exactly as the line layer folds it, so a ticked box
// means the same thing on the map and in the list.
const RAIL_CANON = {
  'Thameslink':'Thameslink', 'Southeastern':'Southeastern', 'Southern':'Southern',
  'Gatwick Express':'Southern', 'Great Northern':'Great Northern',
  'South Western Railway':'South Western Railway', 'Greater Anglia':'Greater Anglia',
  'Stansted Express':'Greater Anglia', 'c2c':'c2c',
  'Chiltern Railways':'Chiltern Railways',
  'Great Western Railway':'Great Western Railway'};
const RAIL_LONG = new Set(['Heathrow Express', 'Hull Trains', 'East Midlands Railway',
  'West Midlands Trains', 'Grand Central', 'Lumo', 'Avanti West Coast', 'CrossCountry',
  'London North Eastern Railway', 'Eurostar', 'Caledonian Sleeper']);
let RAIL_OTHER = '';
const railOpsOf = s => s.L
  .map(l => RAIL_CANON[l] || (RAIL_LONG.has(l) ? RAIL_OTHER : null)).filter(Boolean);
// Off, the ticks only colour the map. On, they are a filter, and a station with
// no train at all fails it -- "only these operators" has to mean that, or
// picking one company would still leave every tube station in the list.
const passesRail = s => !state.railStn || !RAIL_ON
  || railOpsOf(s).some(o => RAIL_ON.has(o));

const railFilter = () => {
  const base = ['==', ['get','mode'], 'national-rail'];
  return RAIL_ON ? ['all', base, ['in', ['get','op'], ['literal', [...RAIL_ON]]]] : base;
};
function applyRail(){
  if (!ready) return;
  for (const id of ['rail-path', 'rail-casing']) MAP.setFilter(id, railFilter());
}
function buildRailOps(lines){
  const ops = lines.features.map(f => f.properties)
    .filter(o => o.mode === 'national-rail')
    .sort((a, b) => a.ui - b.ui);
  if (!ops.length){ $('#railBlock').style.display = 'none'; return; }
  RAIL_ON = new Set(ops.map(o => o.op));
  $('#railOps').innerHTML = ops.map(o =>
    `<label style="color:${o.color}" title="${o.op}（${o.n} 段轨道）">`
    + `<input type="checkbox" checked data-op="${o.op}"><s></s>`
    + `<span>${o.short || o.op}</span></label>`).join('');
  const boxes = () => [...$('#railOps').querySelectorAll('input')];
  RAIL_OTHER = ops[ops.length - 1].op;      // the grab-bag sorts last by design
  $('#railOps').addEventListener('input', () => {
    RAIL_ON = new Set(boxes().filter(b => b.checked).map(b => b.dataset.op));
    applyRail();
    if (state.railStn) draw();
  });
  const setAll = on => { boxes().forEach(b => b.checked = on);
                         $('#railOps').dispatchEvent(new Event('input')); };
  $('#railAll').onclick = () => setAll(true);
  $('#railNone').onclick = () => setAll(false);
}

const METRIC = {
  br: {t:'住宅入室（估算）/ 千户 / 年', f:v => v.toFixed(0),
       n:'把每个 LSOA 的入室按「住宅数」和「实体铺面数」两个暴露面拟合后拆分，只取住宅那部分。伦敦中位 10.1。这是估算值不是分类：住宅数和铺面数相同的两个 LSOA 会得到相同的拆分比例。'},
  bh: {t:'入室盗窃（含商铺）/ 千户 / 年', f:v => v.toFixed(0),
       n:'警方原始数据，商铺入室和住宅入室是同一类。分母是住宅数。伦敦中位 11.9。商业区会极高——City of London 001F 是 288。'},
  rs: {t:'入室中住宅占比 %', f:v => v.toFixed(0) + '%',
       n:'模型估计有多少比例的入室发生在住宅而非铺面。伦敦中位 92%；City of London 001F 只有 4%。低 = 上一个数基本在讲商铺。'},

    for (let b = +m[1]; b <= +m[2]; b++) out.add(bedKey(b));

  if (state.noNu && d.nu && d.nu.length) return null;
  if (d.plots && d.plots.length){
    const m = d.plots.filter(p => priceOk(p.price) && bedsOk(p.beds));
    return m.length ? {n:m.length, from:Math.min(...m.map(p => p.price)),
                       beds:new Set(m.map(p => bedKey(p.beds)))} : null;
  }
  if (d.from == null) return state.unk ? {n:null, from:null, beds:bedsOf(d.summary), loose:true} : null;
  if (d.from > state.pmax*1000 && state.pmax < 1000) return null;
  if (d.to != null && d.to < state.pmin*1000) return null;
  const bs = bedsOf(d.summary);
  if (state.beds.size && bs.size && ![...state.beds].some(b => bs.has(b))) return null;

  // that it has one in the range: confirmed only when X itself is in the range and
  // no bedroom type is asked for. Otherwise it is kept, and marked as unconfirmed.

  if (state.prem && !x.prem) return false;
  if (state.noNu && x.nu && x.nu.length) return false;
  if (state.minNr > 0 && !(x.nr >= state.minNr && x.rm != null)) return false;

function composite(s){

  if (state.phase === 'let') parts.push([s.supS, w.sup], [s.demS, w.dem], [s.schS, w.sch]);
  let n = 0, d = 0;

  if (state.prem && !s.prem) return false;

    for (const p of rows){
      if (Math.abs(p[0]-s.y) > dy || Math.abs(p[1]-s.x) > dx) continue;
      out.push({type:'Feature', geometry:{type:'Point', coordinates:[p[1], p[0]]},

// Thirty-two listings sit on fifteen points, because Price Paid knows streets and
// not blocks and several listings share a street. One marker per point, carrying
// how many are on it, beats scattering them at coordinates nobody measured.
function groupListings(rows){
  const by = new Map();
  for (const r of rows){
    if (typeof r.lat !== 'number' || typeof r.lon !== 'number') continue;
    const k = r.lat.toFixed(5) + ',' + r.lon.toFixed(5);
    if (!by.has(k)) by.set(k, {lat:r.lat, lon:r.lon, dev:r.development, street:r.street,
                              geo:r.geo, rows:[]});
    by.get(k).rows.push(r);

    g.i = i;
    g.rows.sort((a, b) => b.net_after_mgmt - a.net_after_mgmt);
    g.best = g.rows[0].net_after_mgmt;

// Everything for sale that passes the filter, new builds and hand-collected
// listings together, in one list. The "综合" order averages how quick the commute
// is, how safe the nearest station's walk is and how cheap this is among the
// others on the list -- the same three things the station ranking uses.
let HOME_ITEMS = [], homeSort = 'price';
const BEDLAB = {0:'Studio', 1:'1 房', 2:'2 房', 3:'3 房+'};
function homeItems(){
  const out = [];
  if (DEV) DEV.developments.forEach((d, i) => {
    if (!srcOn(d.dev) || (!state.soon && d.status === 'coming')) return;
    const m = devMatch(d); if (!m) return;
    out.push({kind:'d', d, m, name:d.name, color:devStyle(d.dev).c, dev:DEV.developers[d.dev] || d.dev,
              price:m.from, gp:d.gp ? d.gp.min : null, cw:d.cw ?? null, ls:d.ls ?? null, nu:d.nu, ns:nsOf(d), soon:d.status === 'coming'});
  });
  if (srcOn('lst')) for (const g of LGROUPS){
    const m = groupMatch(g); if (!m) continue;
    out.push({kind:'l', g, m, name:g.dev, color:'#c2402a', dev:'候选房源', price:m.from,
              gp:gpOf(g), cw:cwOf(g), ls:lsOf(g), nu:[], ns:nsOf(g), soon:false});
  }
  const prices = out.map(o => o.price).filter(v => v != null).sort((a, b) => a - b);
  for (const o of out){
    const cheap = o.price == null || prices.length < 2 ? null
      : 1 - prices.findIndex(v => v >= o.price) / (prices.length - 1);
    const conv = convOf(o.gp, o.cw, o.ls);
    const parts = [conv, o.ns && o.ns.s.safe, cheap].filter(v => v != null);
    o.score = parts.length ? Math.max(0, parts.reduce((a, b) => a + b, 0) / parts.length - nuPen(o)) : null;
  }
  const key = {price:o => o.price ?? 9e9, time:o => o.gp ?? 999, score:o => -(o.score ?? -1)}[homeSort];
  // Homes whose price and type are confirmed come before developments that are only possible.
  return out.sort((a, b) => (!!a.m.loose - !!b.m.loose) || key(a) - key(b));
}

/* ---------- basemap ---------- */
// The archive is fetched whole and served from memory. PMTiles is built for HTTP
// range requests, but nothing guarantees the host serving these files answers
// them, and a range request that quietly returns the whole file would break every
// directory lookup. One fetch of a known size cannot.
// The .wasm suffix on the tile archive and the glyphs is not a lie about their
// contents, it is the only way to get them served: the artifact host serves a
// fixed list of extensions and .wasm is the one on it that comes back as exact
// bytes. Nothing here is WebAssembly and nothing tries to execute it.
class BufferSource {
  constructor(key, buf){ this.key = key; this.buf = buf; }
  getKey(){ return this.key; }
  async getBytes(offset, length){ return {data: this.buf.slice(offset, offset + length)}; }
}
// Glyphs go through their own protocol so a range this page does not ship comes
// back empty instead of failing. MapLibre shapes a whole tile's labels in one
// pass, and one glyph range that fails to parse -- a 404 page, say, from a host
// that answers a missing file with HTML -- drops that entire tile, streets and
// all: a curly apostrophe in "Bishop’s Mansions" once blanked a square
// kilometre of the City. A missing character should cost that character.
const GLYPH_RANGES = new Set(['0-255', '256-511', '8192-8447', '8448-8703']);
maplibregl.addProtocol('glyphs', async (params, abort) => {
  const [, stack, range] = params.url.match(/^glyphs:\/\/([^/]+)\/(\d+-\d+)$/) || [];
  const empty = {data: new ArrayBuffer(0)};
  if (!GLYPH_RANGES.has(range)) return empty;
  try {
    const r = await fetch(`data/fonts/${stack}/${range}.wasm`, {signal: abort.signal});
    return r.ok ? {data: await r.arrayBuffer()} : empty;
  } catch (e) { if (e.name === 'AbortError') throw e; return empty; }
});
function styleFor(buffer){
  const proto = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', proto.tile);
  proto.add(new pmtiles.PMTiles(new BufferSource('london', buffer)));
  // The glyph URL puts the font stack in the path, so the stacks are renamed to
  // something that needs no escaping.
  // Protomaps' 'light' flavour, which is what the original map used. Earlier
  // versions here tried grayscale and then white to stop the choropleth
  // competing with the basemap; the answer was to turn the choropleth down, not
  // to drain the map.
  const layers = JSON.parse(JSON.stringify(basemaps.layers('protomaps',
      basemaps.namedFlavor('light'), {lang:'en'}))
    .replace(/"Noto Sans (Regular|Medium|Italic)"/g, '"NotoSans$1"')
    .replace(/"Noto Sans [^"]*"/g, '"NotoSansRegular"'));
  return {
    version: 8,
    glyphs: 'glyphs://{fontstack}/{range}',
    sprite: new URL('data/sprites/light', location.href).href,
    sources: {protomaps: {type:'vector', url:'pmtiles://london',
                          attribution:'© OpenStreetMap · Protomaps'}},
    layers
  };
}

/* ---------- boot ---------- */
async function boot(){
  const note = t => { const p = $('#progress'); if (p) p.textContent = t; };
  // Revalidate rather than reuse blindly: the payload has to match the page it
  // shipped with, and a cached shortlist from an older build is a version
  // mismatch that looks exactly like a bug. A 304 still costs nothing.
  const opt = {cache:'no-cache'};
  const j = p => fetch(p, opt).then(r => r.json());
  note('底图 14.7 MB…');
  const [buffer, lsoa, bor, stations, amen, breaks, schemes, lines, short, devs, schools] =
    await Promise.all([
      fetch('data/london.pmtiles.wasm', opt).then(r => r.arrayBuffer()),
      j('data/lsoa.geojson'), j('data/boroughs.geojson'), j('data/stations.json'),
      j('data/amenities.json'), j('data/breaks.json'),
      j('data/schemes.json').catch(() => []),
      j('data/lines.geojson').catch(() => ({type:'FeatureCollection', features:[]})),
      j('data/shortlist.json').catch(() => null),
      j('data/devs.json').catch(() => null),
      j('data/schools.json').catch(() => [])]);
  S = stations; AM = amen; BREAKS = breaks; SHORT = short; DEV = devs; SCH = schools;
  SC = schemes; SC.forEach((x, i) => x.i = i);
  LGROUPS = SHORT ? groupListings(SHORT.listings) : [];
  score(); scoreSchemes();
  note('绘制…');

  MAP = new maplibregl.Map({
    container:'map', style:styleFor(buffer), center:[-0.09, 51.505], zoom:10.6,
    minZoom:9, maxZoom:17, attributionControl:{compact:true},
    maxBounds:[[-0.62, 51.26], [0.36, 51.74]]});
  MAP.on('error', e => {
    const msg = (e && e.error && e.error.message) || String(e);
    console.warn('map error:', msg);
    const el = $('#loading');
    if (el && !ready) el.innerHTML = '地图没能加载。<br><span style="font-size:11.5px">'
      + msg.replace(/</g, '&lt;') + '</span>';
  });
  MAP.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-left');
  MAP.addControl(new maplibregl.ScaleControl({maxWidth:90, unit:'metric'}), 'bottom-right');

  MAP.on('load', () => {
    // Put the choropleth under the roads so the street network and every label
    // still read through it; a fill on top of the basemap just erases the basemap.
    const firstRoad = (MAP.getStyle().layers.find(l => l.id.startsWith('roads')) || {}).id;

    MAP.addSource('lsoa', {type:'geojson', data:lsoa});
    MAP.addLayer({id:'lsoa-fill', type:'fill', source:'lsoa',
      paint:{'fill-color':fillColor('br'), 'fill-opacity':state.op}}, firstRoad);
    MAP.addLayer({id:'lsoa-line', type:'line', source:'lsoa',
      paint:{'line-color':'#ffffff', 'line-width':0.3, 'line-opacity':0.35}}, firstRoad);

    MAP.addSource('bor', {type:'geojson', data:bor});
    MAP.addLayer({id:'bor-line', type:'line', source:'bor',
      paint:{'line-color':'#5b6b78', 'line-width':1.1, 'line-opacity':0.75}});

    // Track geometry, not the schematic: TfL's route endpoint returns one point
    // per station, which over a real street map cuts corners through buildings.
    const firstLabel = (MAP.getStyle().layers.find(l => l.type === 'symbol') || {}).id;
    MAP.addSource('lines', {type:'geojson', data:lines});
    // National Rail is its own pair of layers, under the TfL ones and a little
    // thinner. It is one navy rather than a colour per operator because outside
    // TfL there is no line colour a reader carries in their head -- the tube map
    // draws the trains as one styling for the same reason -- and because fifteen
    // tube colours plus a choropleth is already the map's whole colour budget.
    // A dash, not a hue, is what separates these from the tube. The tube owns
    // every colour on the wheel -- red, navy, green, teal, purple, magenta,
    // orange, yellow, pink, grey, black -- so no palette could stay clear of it,
    // and an operator drawn in its own livery colour would read as a tube line
    // the reader had forgotten. Dashed, at three quarters the width, it reads as
    // a different class of railway at a glance and the colours are then free to
    // mean the company.
    MAP.addLayer({id:'rail-casing', type:'line', source:'lines', filter:railFilter(),
      layout:{'line-cap':'butt', 'line-join':'round'},
      paint:{'line-color':'#ffffff',
             'line-width':['interpolate', ['linear'], ['zoom'], 10, 2, 13, 3.8, 16, 7],
             'line-opacity':0.85}}, firstLabel);
    MAP.addLayer({id:'rail-path', type:'line', source:'lines', filter:railFilter(),
      layout:{'line-cap':'butt', 'line-join':'round'},
      paint:{'line-color':['get','color'], 'line-dasharray':[2.2, 1.3],
             'line-width':['interpolate', ['linear'], ['zoom'], 10, 1, 13, 2.2, 16, 4.2]}},
      firstLabel);
    const notRail = ['!=', ['get','mode'], 'national-rail'];
    MAP.addLayer({id:'line-casing', type:'line', source:'lines', filter:notRail,
      layout:{'line-cap':'round', 'line-join':'round'},
      paint:{'line-color':'#ffffff',
             'line-width':['interpolate', ['linear'], ['zoom'], 10, 2.5, 13, 5, 16, 9],
             'line-opacity':0.8}}, firstLabel);
    MAP.addLayer({id:'line-path', type:'line', source:'lines', filter:notRail,
      layout:{'line-cap':'round', 'line-join':'round'},
      paint:{'line-color':['get','color'],
             'line-width':['interpolate', ['linear'], ['zoom'], 10, 1.4, 13, 3, 16, 6]}},
      firstLabel);

    MAP.addSource('ring', {type:'geojson', data:ringFC(null)});

    MAP.addLayer({id:'stations-dot', type:'circle', source:'stations',
      paint:{
        'circle-radius':['interpolate', ['linear'], ['zoom'],

          13, ['+', 3, ['*', 3, ['get','c']]],
          16, ['+', 6, ['*', 5, ['get','c']]]],

        'circle-stroke-color':'#ffffff',
        'circle-stroke-width':['interpolate', ['linear'], ['zoom'], 9, 0.4, 13, 1.1],
        'circle-opacity':0.95}});
    MAP.addLayer({id:'stations-label', type:'symbol', source:'stations', minzoom:12.5,
      layout:{'text-field':['get','n'], 'text-font':['NotoSansMedium'], 'text-size':11.5,

      paint:{'text-color':'#ffffff'}});

    // Badges are drawn once per developer and status and registered as images.
    for (const k of new Set([...Object.keys(DEV_STYLE), ...(DEV ? DEV.developments.map(d => d.dev) : [])]))
      for (const soon of [false, true]){
        const cv = badge(k, soon);
        MAP.addImage('dev-' + k + (soon ? '-soon' : ''),
          cv.getContext('2d').getImageData(0, 0, cv.width, cv.height), {pixelRatio:2});
      }
    MAP.addSource('devs', {type:'geojson', data:devFC()});
    MAP.addLayer({id:'dev-icon', type:'symbol', source:'devs',
      layout:{'icon-image':['get','icon'], 'icon-allow-overlap':true, 'icon-ignore-placement':true,
              'icon-size':['interpolate', ['linear'], ['zoom'], 9, 0.62, 13, 0.9, 16, 1.1]}});
    MAP.addLayer({id:'dev-label', type:'symbol', source:'devs', minzoom:12.5,
      layout:{'text-field':['get','label'], 'text-font':['NotoSansMedium'], 'text-size':11.5,
              'text-anchor':'left', 'text-offset':[1.4, 0], 'text-justify':'left', 'text-optional':true},
      paint:{'text-color':['get','color'], 'text-halo-color':'#ffffff', 'text-halo-width':1.6}});

    // Schools, optional: the colour is the school's own 0-1 quality number.
    MAP.addSource('schools', {type:'geojson', data:{type:'FeatureCollection', features:SCH.map((s, i) => ({
      type:'Feature', geometry:{type:'Point', coordinates:[s.x, s.y]},
      properties:{i, n:s.n, q:s.q ?? -1, p:s.p}}))}});
    MAP.addLayer({id:'school-dot', type:'circle', source:'schools', minzoom:11.5, layout:{visibility:'none'},
      paint:{'circle-radius':['interpolate', ['linear'], ['zoom'], 11.5, 2.5, 15, 6],
             'circle-color':['step', ['get','q'], '#9aa3ab', 0, '#c2402a', 0.4, '#d89a2b', 0.6, '#8bb04a', 0.8, '#2f7d4f'],
             'circle-stroke-color':['case', ['==', ['get','p'], 'S'], '#16202b', '#ffffff'],
             'circle-stroke-width':['case', ['==', ['get','p'], 'S'], 1.6, 0.8]}});
    MAP.addLayer({id:'school-label', type:'symbol', source:'schools', minzoom:14, layout:{visibility:'none',
      'text-field':['get','n'], 'text-font':['NotoSansMedium'], 'text-size':10.5, 'text-offset':[0, 1], 'text-anchor':'top'},
      paint:{'text-color':'#16202b', 'text-halo-color':'#ffffff', 'text-halo-width':1.4}});
    MAP.on('click', 'school-dot', e => {
      const s = SCH[e.features[0].properties.i];
      new maplibregl.Popup({closeButton:false, maxWidth:'280px'}).setLngLat([s.x, s.y]).setHTML(
        `<div style="font:12px/1.45 Archivo,sans-serif;color:#16202b"><b>${s.n}</b><br>${s.p === 'P' ? '小学' : '中学'} · ${s.la}${s.np ? ' · ' + s.np + ' 人' : ''}<br>
         Ofsted：${olText(s)}<br>${resText(s)}<br>${schTags(s)}<br><a href="https://reports.ofsted.gov.uk/provider/21/${s.u}" target="_blank" rel="noopener">Ofsted 报告</a></div>`).addTo(MAP);
    });
    MAP.on('click', 'stations-dot', e => select(S.find(s => s.n === e.features[0].properties.n)));
    MAP.on('click', 'listing-dot', e => selectGroup(LGROUPS[e.features[0].properties.i]));
    MAP.on('click', 'scheme-dot', e => selectScheme(SC[e.features[0].properties.i]));
    MAP.on('click', 'dev-icon', e => selectDev(DEV.developments[e.features[0].properties.i]));
    for (const id of ['scheme-dot', 'grocer-dot', 'market-dot', 'school-dot']){
      MAP.on('mouseenter', id, () => MAP.getCanvas().style.cursor = 'pointer');
      MAP.on('mouseleave', id, () => MAP.getCanvas().style.cursor = '');
    }
    for (const id of ['listing-dot', 'listing-count', 'dev-icon']){
      MAP.on('mouseenter', id, () => MAP.getCanvas().style.cursor = 'pointer');
      MAP.on('mouseleave', id, () => MAP.getCanvas().style.cursor = '');
    }
    for (const id of ['stations-dot', 'amen-dot']){
      MAP.on('mouseenter', id, () => MAP.getCanvas().style.cursor = 'pointer');
      MAP.on('mouseleave', id, () => MAP.getCanvas().style.cursor = '');
    }
    const pop = new maplibregl.Popup({closeButton:false, closeOnClick:false, offset:8});
    MAP.on('mouseenter', 'amen-dot', e => pop
      .setLngLat(e.lngLat).setText(e.features[0].properties.name || '').addTo(MAP));
    MAP.on('mouseleave', 'amen-dot', () => pop.remove());

    ready = true;
    buildRailOps(lines);
    buildHomeSrc();
    drawLegend(); wire();
    const have = new Set(lines.features.map(f => f.properties.name));
    const want = ['Elizabeth line', 'London Overground', 'DLR', 'Central', 'Victoria'];
    const gone = want.filter(n => !have.has(n));
    const nr = lines.features.filter(f => f.properties.mode === 'national-rail');
    $('#lineNote').textContent = gone.length
      ? `线路层缺 ${gone.join('、')}。`
      : `${have.size - nr.length} 条 TfL 线路，实际轨道线形；Overground 按一条橙线画，不拆六条。`
        + (nr.length ? ' 虚线是国铁，按运营商分色（近似各家品牌色），可单独勾选。'
              + '用虚线而不是换色系来区分：地铁已经把整个色环占满了。'
              + '共线路段显示叠在最上面的那家，想看某一家单独勾它。' : '');
    $('#stamp').textContent = `${S.length} 站 · ${SC.length} 楼盘 · ${LGROUPS.reduce((a,g)=>a+g.rows.length,0)} 在售${DEV ? ' · ' + DEV.developments.length + ' 新盘' : ''}`;
    $('#loading').remove();
    // Open on a station that makes the point: Zone 3, on the resale shortlist.
    select(S.find(s => s.n === 'Kidbrooke') || S[0]);
  });
}
boot().catch(e => {
  // A half-loaded page that says nothing is worse than one that says what broke.
  const el = $('#loading');
  if (el) el.innerHTML = '地图没能加载。<br><span style="font-size:11.5px">'
    + String(e && e.message || e).replace(/</g, '&lt;') + '</span>';
  throw e;
});
</script>
